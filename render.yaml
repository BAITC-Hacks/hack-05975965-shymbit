# Шаблон, не выполненное развёртывание. База на ПЛАТНОМ тарифе.
# Перед Apply проверьте регион, стоимость и уникальные имена ресурсов.
databases:
  - name: sana-postgres
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: sana-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: sana-postgres
          property: connectionString
      - key: DB_SSL_MODE
        value: require
      - key: DB_POOL_MAX
        value: "5"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: sana-web
    runtime: static
    # Без rootDir пути однозначно считаются от корня репозитория.
    buildCommand: npm --prefix frontend ci --include=dev && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        sync: false
      - key: VITE_USE_MOCK_API
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
