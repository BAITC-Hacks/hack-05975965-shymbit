name: Проверки приложения
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sana
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: sana_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sana -d sana_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm run setup
      - run: npm --prefix backend test
      - run: npm run test:startup
      - run: npm --prefix frontend test
      - name: Проверка настоящей PostgreSQL и frontend-контракта
        env:
          TEST_DATABASE_URL: postgresql://sana:local_ci_only@127.0.0.1:5432/sana_test
          TEST_DB_SSL_MODE: disable
        run: |
          npm --prefix backend run test:postgres
          npm --prefix frontend test
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
